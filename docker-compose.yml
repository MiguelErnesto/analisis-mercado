services:
  api:
    build: .
    image: analisis-mercado
    command: python3 -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - pgnet
    restart: unless-stopped

  etl:
    image: analisis-mercado
    command: python3 -m etl.run
    env_file: .env
    networks:
      - pgnet
    profiles:
      - etl

networks:
  pgnet:
    name: ${POSTGRES_DOCKER_NETWORK:?definir POSTGRES_DOCKER_NETWORK en .env}
    external: true
